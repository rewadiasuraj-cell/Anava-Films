name: Validate website build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Generate and package website
        run: npm run build
      - name: Verify generated pages and deployment files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("dist")
          expected = ["index.html", "work.html", "process.html", "about.html",
                      "contact.html", "404.html", ".htaccess", "robots.txt",
                      "sitemap.xml", "assets/css/anava.css", "assets/js/anava.js"]
          missing = [path for path in expected if not (root / path).is_file()]
          if missing:
              raise SystemExit("Missing deployment files: " + ", ".join(missing))
          for page in ["index", "work", "process", "about", "contact"]:
              html = (root / f"{page}.html").read_text(encoding="utf-8")
              for marker in ('<title>', 'assets/css/anava.css', 'assets/js/anava.js'):
                  if marker not in html:
                      raise SystemExit(f"{page}.html missing {marker}")
          print("Build validation passed: all five pages and deployment files present.")
          PY
      - name: Simulate Hostinger build without Python
        env:
          PYTHON: /usr/bin/python3-not-installed
        run: |
          npm run build
          node <<'JS'
          const fs = require('fs');
          const crypto = require('crypto');
          const pages = ['index','work','process','about','contact'];
          const css = fs.readFileSync('assets/css/anava.css');
          const expected = crypto.createHash('sha1').update(css).digest('hex').slice(0,10);
          for (const page of pages) {
            const html = fs.readFileSync('dist/' + page + '.html','utf8');
            if (!html.includes('assets/css/anava.css?v=' + expected)) {
              throw new Error(page + ': CSS cache version mismatch');
            }
          }
          console.log('No-Python Hostinger build passed with fresh CSS versions.');
          JS
      - name: Audit local assets and page semantics
        run: python3 scripts/audit_site.py
