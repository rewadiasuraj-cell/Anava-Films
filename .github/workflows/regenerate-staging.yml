name: Regenerate staged Anava pages

on:
  push:
    branches: [feat/locations-wow-testimonials]
    paths:
      - '.github/workflows/regenerate-staging.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 build_anava.py
      - name: Commit generated site pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html work.html process.html about.html contact.html 404.html
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate pages for editorial portfolio order"
            git push origin HEAD:feat/locations-wow-testimonials
          fi
