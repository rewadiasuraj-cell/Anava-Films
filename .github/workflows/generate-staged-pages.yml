name: Generate staged testimonial pages

on:
  push:
    branches:
      - feat/locations-wow-testimonials
    paths:
      - .github/workflows/generate-staged-pages.yml
      - work.json

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate all website pages from the source
        run: python3 build_anava.py
      - name: Commit generated HTML to staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html work.html process.html about.html contact.html 404.html
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate staged testimonial pages"
            git push origin HEAD:feat/locations-wow-testimonials
          fi
