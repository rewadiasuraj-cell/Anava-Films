name: Regenerate staged Lenskart Vertical page

on:
  push:
    branches: [feat/locations-wow-testimonials]
    paths: ['.github/workflows/staging-regen-lenskart18.yml']

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate site pages
        run: python3 build_anava.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html work.html process.html about.html contact.html 404.html
          if ! git diff --cached --quiet; then
            git commit -m "build: generate page for Lenskart vertical film 18"
            git push origin HEAD:feat/locations-wow-testimonials
          fi
